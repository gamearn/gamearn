org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
# Keep Gradle + Kotlin + R8 within the ~7GB RAM of GitHub Actions runners to
# avoid OOM kills (exit code 143 / SIGTERM) during obfuscated release builds.
org.gradle.workers.max=2
org.gradle.daemon=false
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
