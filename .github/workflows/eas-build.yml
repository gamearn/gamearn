name: EAS iOS TestFlight Build
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Submit to TestFlight via EAS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build and auto-submit to TestFlight
        run: eas build --platform ios --profile production --auto-submit --non-interactive
