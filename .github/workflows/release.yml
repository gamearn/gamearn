name: Build release APK, AAB and IPA
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        options: [both, android, ios]
        default: both
      build_number:
        description: 'Optional unused store build number (default: 1000 + run number)'
        type: string
      refresh_profiles:
        description: Refresh Apple distribution profiles using the existing API key
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: version
        name: Validate release version
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: node scripts/ci/release-version.cjs
  android:
    needs: prepare
    if: github.event_name == 'push' || inputs.platform != 'ios'
    uses: ./.github/workflows/android-release.yml
    with:
      build_number: ${{ needs.prepare.outputs.build_number }}
    secrets: inherit
  ios:
    needs: prepare
    if: github.event_name == 'push' || inputs.platform != 'android'
    uses: ./.github/workflows/ios-release.yml
    with:
      build_number: ${{ needs.prepare.outputs.build_number }}
      refresh_profiles: ${{ inputs.refresh_profiles == true }}
    secrets: inherit
