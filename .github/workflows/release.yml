name: 🚀 Release Build (Android AAB + APK)

"on":
  push:
    tags:
      - 'v*.*.*'   # triggers on tags like v1.0.0, v1.2.3, v2.0.0-beta
  workflow_dispatch:

permissions:
  contents: write  # needed to create GitHub Releases

jobs:
  build-release:
    name: Build & Release AAB + APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true

      - name: 🔑 Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 -m json.tool android/app/google-services.json > /dev/null

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: 🔑 Set up Signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: 🏗️ Build release AAB (Signed + Obfuscated)
        run: flutter build appbundle --release --no-tree-shake-icons --obfuscate --split-debug-info=./debug_symbols --dart-define=NODE_API_BASE=${{ secrets.NODE_API_BASE }}

      - name: 🏗️ Build release APK (Signed + Obfuscated)
        run: flutter build apk --release --no-tree-shake-icons --obfuscate --split-debug-info=./debug_symbols --dart-define=NODE_API_BASE=${{ secrets.NODE_API_BASE }}

      - name: 📦 Upload debug symbols
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: debug_symbols-${{ github.ref_name }}
          path: ./debug_symbols
          retention-days: 90

      - name: ✏️ Rename artifacts with version tag
        run: |
          VERSION=${{ github.ref_name }}
          AAB_DIR=build/app/outputs/bundle/release
          APK_DIR=build/app/outputs/flutter-apk
          mv "$AAB_DIR/app-release.aab" "$AAB_DIR/gamearn-${VERSION}.aab"
          mv "$APK_DIR/app-release.apk" "$APK_DIR/gamearn-${VERSION}.apk"
          echo "AAB_PATH=$AAB_DIR/gamearn-${VERSION}.aab" >> $GITHUB_ENV
          echo "AAB_NAME=gamearn-${VERSION}.aab" >> $GITHUB_ENV
          echo "APK_PATH=$APK_DIR/gamearn-${VERSION}.apk" >> $GITHUB_ENV
          echo "APK_NAME=gamearn-${VERSION}.apk" >> $GITHUB_ENV

      - name: 🎉 Create GitHub Release & upload AAB + APK
        uses: softprops/action-gh-release@v2
        with:
          name: "Gamearn ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🎮 Gamearn ${{ github.ref_name }}

            ### What's new
            - 🚀 Splash on every launch with backend health + network bootstrap
            - 🌍 Multi-language (English / Français / Español)
            - 🌟 Gamearn Premium — weekly / monthly / lifetime plans
            - 📢 AdMob ads (interstitial before matches, rewarded for free users)
            - 🤝 Invite & referral — 10% tournament commission
            - 🔐 MFA (2FA) with email + phone authenticators
            - 🗑️ Delete account (App Store compliant)
            - 📄 In-app Terms & Conditions + Privacy Policy

            ### Previous releases
            - ✅ Full auth flow: Landing → Register → OTP → Profile Setup → Login
            - ✅ Home dashboard: wallet, streak, tournaments, games, leaderboard
            - ✅ Tour screen: live tournaments with status badges
            - ✅ Wallet & Earnings: units system, transaction history, Paystack
            - ✅ Profile: avatar, stats, friends, Go Premium
            - **Whot, Draughts, Ayo, Ludo games with AI bot integration**

            ### Install
            > Play Store: upload `${{ env.AAB_NAME }}` (bundle) to the Google Play Console.
            >
            > Sideload/QA: install `${{ env.APK_NAME }}` directly.

            ---
            Built from commit \`${{ github.sha }}\`
          files: |
            ${{ env.AAB_PATH }}
            ${{ env.APK_PATH }}
          draft: false
          prerelease: false
