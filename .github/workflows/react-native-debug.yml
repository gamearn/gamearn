name: React Native Debug Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build React Native debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_PUBLIC_NODE_API_BASE: https://api.gamearn.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Inject Firebase config
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > google-services.json
          test -s google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      - name: Generate React Native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: gamearn-react-native-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
