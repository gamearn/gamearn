name: React Native checks
on:
  push:
    branches: [main, feature/react-native-app]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/ci/*.test.cjs
      - name: Bundle Android and iOS JavaScript
        run: npx expo export --platform android --platform ios --output-dir dist-check
