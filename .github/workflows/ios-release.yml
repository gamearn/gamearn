name: 🚀 iOS Release (IPA via fastlane match)

"on":
  push:
    tags:
      - 'v*.*.*'   # triggers on tags like v1.0.0, v1.2.3, v2.0.0-beta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build & Export IPA
    runs-on: macos-latest

    concurrency:
      group: ios-release
      cancel-in-progress: false

    env:
      NODE_API_BASE: ${{ secrets.NODE_API_BASE }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      MATCH_REPO: ${{ secrets.MATCH_REPO }}

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🔐 Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          working-directory: ios

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true

      - name: 🔑 Inject GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          # Secret holds base64 of the plist (matches GOOGLE_SERVICES_JSON for Android)
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔍 Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: 🏗️ Generate iOS project (pods + workspace) via unsigned build
        run: flutter build ios --release --no-codesign --dart-define=NODE_API_BASE=${{ secrets.NODE_API_BASE }}

      - name: 🎫 Setup signing certs & profiles (match, auto-provisions via API)
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_REPO: ${{ secrets.MATCH_REPO }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          # App Store Connect API key — lets match CREATE the Distribution cert +
          # App Store profile for com.gamearn if missing and commit to MATCH_REPO,
          # so no local Mac is ever required.
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          cd ios
          bundle install
          bundle exec fastlane match appstore --force_for_new_devices true

      - name: 🏗️ Build & export iOS IPA (App Store)
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          NODE_API_BASE: ${{ secrets.NODE_API_BASE }}
        run: |
          cd ios
          bundle exec fastlane build_ipa

      - name: ✏️ Rename IPA with version tag
        run: |
          VERSION=${{ github.ref_name }}
          mv build/ios/ipa/Gamearn.ipa build/ios/ipa/gamearn-${VERSION}.ipa
          echo "IPA_PATH=build/ios/ipa/gamearn-${VERSION}.ipa" >> $GITHUB_ENV
          echo "IPA_NAME=gamearn-${VERSION}.ipa" >> $GITHUB_ENV

      - name: 🎉 Attach IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.IPA_PATH }}

      - name: ✈️ Upload to TestFlight (App Store Connect)
        if: ${{ env.UPLOAD_TO_TESTFLIGHT == 'true' }}
        run: |
          cd ios
          bundle exec fastlane upload_testflight
        env:
          # Expose the presence of the API key as an env var — `secrets` is not
          # allowed directly in `if:`, but `env` is.
          UPLOAD_TO_TESTFLIGHT: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 != '' && 'true' || 'false' }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
