name: iOS release (React Native)
on:
  workflow_call:
    inputs:
      build_number:
        required: true
        type: string
      refresh_profiles:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    concurrency:
      group: gamearn-ios-signing
      cancel-in-progress: false
    env:
      CI: '1'
      BUILD_NUMBER: ${{ inputs.build_number }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      EXPO_PUBLIC_NODE_API_BASE: ${{ secrets.NODE_API_BASE || 'https://api.gamearn.app' }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate signing secrets
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_REPO: ${{ secrets.MATCH_REPO }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: node scripts/ci/require-env.cjs TEAM_ID MATCH_PASSWORD MATCH_GIT_BASIC_AUTHORIZATION MATCH_REPO APP_STORE_CONNECT_API_KEY_KEY_ID APP_STORE_CONNECT_API_KEY_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: npm ci
      - name: Generate React Native iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        working-directory: ios
        run: bundle exec pod install
      - name: Sign, archive and export IPA
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_REPO: ${{ secrets.MATCH_REPO }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          REFRESH_PROFILES: ${{ inputs.refresh_profiles && 'true' || 'false' }}
        run: bundle exec fastlane ios release
      - uses: actions/upload-artifact@v4
        with:
          name: gamearn-ios-${{ inputs.build_number }}
          path: |
            build/ios/*.ipa
            build/ios/*.dSYM.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload Xcode diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gamearn-ios-build-logs-${{ inputs.build_number }}
          path: build/logs
          retention-days: 7
