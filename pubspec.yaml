name: gamearn
description: Gamearn - Play. Earn. Compete.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0

  # Phase 3: Social Login
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.0.1
  sign_in_with_apple: ^6.1.1
  crypto: ^3.0.3

  # Image caching
  cached_network_image: ^3.3.1

  # Formatting
  intl: ^0.19.0
  pinput: ^6.0.2
  flutter_svg: ^2.3.0
   
  # Networking to Backend
  http: ^1.2.0
  socket_io_client: ^2.0.3+1

  # Audio
  just_audio: ^0.9.43
  shared_preferences: ^2.3.3
  firebase_messaging: ^15.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# Launcher Icons Config
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/logo_dark.png"
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground: "assets/logos/logo_icon.png"
  image_path_ios: "assets/logos/logo_dark.png"
  web:
    generate: true
    image_path: "assets/logos/logo_dark.png"
    background_color: "#0A0E1A"
    theme_color: "#00E5FF"

flutter:
  uses-material-design: true

  assets:
    # Logos
    - assets/logos/logo_dark.png
    - assets/logos/logo_light.png
    - assets/logos/logo_icon.png
    - assets/logos/logo_horizontal.png
    # Games
    - assets/games/whot.jpg
    - assets/games/ludo.png
    - assets/games/ayo.jpg
    - assets/games/draughts.jpg
    # Audio — replace .mp3 files with real assets
    - assets/audio/sfx/
