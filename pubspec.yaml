name: gamearn
description: Gamearn - Play. Earn. Compete.
publish_to: 'none'
version: 2.0.23+23

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0

  # Phase 3: Social Login
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.0.1
  sign_in_with_apple: ^6.1.1
  crypto: ^3.0.3

  # Image caching
  cached_network_image: ^3.3.1

  # Avatar upload (custom profile pictures)
  image_picker: ^1.1.2
  firebase_storage: ^12.1.0
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.3

  # Formatting
  intl: ^0.20.2
  pinput: ^6.0.2
  flutter_svg: ^2.3.0

  # International phone input (format-agnostic, libphonenumber-backed)
  intl_phone_number_input: ^0.7.5
   
  # Networking to Backend
  http: ^1.2.0
  socket_io_client: ^2.0.3+1

  # Open Paystack hosted payment page
  url_launcher: ^6.3.1

  # Audio
  just_audio: ^0.9.43
  shared_preferences: ^2.3.3
  firebase_messaging: ^15.2.10
  app_links: ^7.0.0

  # Responsive scaling (Figma 390×844 design size)
  flutter_screenutil: ^5.9.3
  shadcn_flutter: ^0.0.53
  google_mobile_ads: ^9.1.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# Launcher Icons Config
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/logo_dark.png"
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground: "assets/logos/logo_icon.png"
  image_path_ios: "assets/logos/logo_dark.png"
  web:
    generate: true
    image_path: "assets/logos/logo_dark.png"
    background_color: "#0A0E1A"
    theme_color: "#00E5FF"

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: SplineSans
      fonts:
        - asset: assets/fonts/spline_sans/SplineSans-Light.ttf
          weight: 300
        - asset: assets/fonts/spline_sans/SplineSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/spline_sans/SplineSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/spline_sans/SplineSans-Bold.ttf
          weight: 700

  assets:
    # Logos
    - assets/logos/logo_dark.png
    - assets/logos/logo_light.png
    - assets/logos/logo_icon.png
    - assets/logos/logo_horizontal.png
    # Games
    - assets/games/whot.jpg
    - assets/games/ludo.png
    - assets/games/ayo.jpg
    - assets/games/draughts.jpg
    - assets/games/whot_icon.jpg
    - assets/games/ludo_icon.jpg
    - assets/games/ayo_icon.jpg
    - assets/games/draughts_icon.jpg
    # Audio — replace .mp3 files with real assets
    - assets/audio/sfx/
    # Auth backgrounds
    - assets/auth/login_bg.png
    - assets/auth/signup_bg.png
    - assets/auth/otp_bg.png
    - assets/auth/forgot_bg.png
    - assets/auth/reset_bg.png
    # Auth avatar
    - assets/auth/login_avatar.png
    - assets/auth/signup_avatar.png
    - assets/auth/forgot_avatar.png
    - assets/auth/reset_avatar.png
    # Auth icons
    - assets/icons/
