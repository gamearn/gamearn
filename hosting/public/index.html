<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gamearn - Verify Email</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #0d0f1c 0%, #141833 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #e8eaf6;
    }
    .card {
      background: #1c2140;
      border: 1px solid #2c3357;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    .logo {
      font-size: 40px;
      font-weight: 800;
      color: #ff8f3d;
      margin-bottom: 8px;
    }
    .title { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
    .status {
      font-size: 14px;
      line-height: 1.6;
      color: #9fa6c8;
      min-height: 44px;
      margin-bottom: 20px;
    }
    .status.ok { color: #4ade80; }
    .status.err { color: #f87171; }
    .loader {
      width: 34px; height: 34px;
      border: 3px solid #2c3357;
      border-top-color: #ff8f3d;
      border-radius: 50%;
      margin: 0 auto 16px;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    button {
      background: #ff8f3d;
      border: none;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    .hidden { display: none; }
    .foot { margin-top: 18px; font-size: 11px; color: #6a7199; letter-spacing: 0.12em; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">G&#9889;</div>
    <div class="title">Gamearn</div>
    <div id="loader" class="loader"></div>
    <div id="status" class="status">Verifying your email&hellip;</div>
    <button id="openApp" class="hidden" onclick="openGamearn()">Open Gamearn</button>
    <div class="foot">SECURED BY GAMEARN SHIELD</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: 'AIzaSyBV8HNGct-D1DdV0Eo4U1RzOhTJ4gw9d94',
      authDomain: 'gamearn-app.firebaseapp.com',
      projectId: 'gamearn-app',
      appId: '1:600025492198:android:a03194ad5fc218a24ca927',
      storageBucket: 'gamearn-app.firebasestorage.app'
    });

    var statusEl = document.getElementById('status');
    var loaderEl = document.getElementById('loader');
    var openAppBtn = document.getElementById('openApp');

    function setState(klass, html) {
      statusEl.className = 'status ' + klass;
      statusEl.innerHTML = html;
      loaderEl.classList.add('hidden');
      if (klass === 'ok') openAppBtn.classList.remove('hidden');
    }

    function openGamearn() {
      try {
        window.location.href =
          'intent://' + location.host + location.pathname + location.search +
          '#Intent;scheme=https;package=com.gamearn;S.browser_fallback_url=' +
          encodeURIComponent(window.location.href) +
          ';end';
      } catch (e) {
        // Fallback: nothing else to do on web.
      }
    }

    (function () {
      var params = new URLSearchParams(window.location.search);
      var mode = params.get('mode');
      var oobCode = params.get('oobCode');

      if (mode !== 'verifyEmail' || !oobCode) {
        setState('err',
          'This link is missing its verification code. ' +
          'Please request a new verification link from the Gamearn app.');
        return;
      }

      firebase.auth().applyActionCode(oobCode)
        .then(function () {
          setState('ok',
            'Your email has been verified!<br>You can close this page and return to the Gamearn app.');
        })
        .catch(function (err) {
          var msg = err && err.message ? err.message : 'The verification link is invalid or has expired.';
          setState('err', msg.replace(/<[^>]*>/g, '') +
            '<br>If the link expired, request a new one from the Gamearn app.');
        });
    })();
  </script>
</body>
</html>
